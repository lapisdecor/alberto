<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="256"
   height="256"
   viewBox="0 0 256 256"
   version="1.1"
   id="alberto-icon"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E97B3"/>
      <stop offset="1" stop-color="#6CCBE2"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>

  <!-- Soft shadow cast by the hat brim over the face -->
  <ellipse cx="128" cy="118" rx="72" ry="9" fill="#12485C" opacity="0.16"/>

  <!-- Face -->
  <circle cx="128" cy="150" r="56" fill="#FFD7B0"/>

  <!-- Hat crown highlight -->
  <rect x="100" y="34" width="56" height="16" rx="8" fill="#FFFFFF" opacity="0.35"/>

  <!-- Hat crown -->
  <rect x="92" y="28" width="72" height="60" rx="16" fill="#FFFFFF"/>

  <!-- Hat band -->
  <rect x="92" y="66" width="72" height="16" rx="8" fill="#E4573F"/>

  <!-- Hat brim -->
  <rect x="56" y="84" width="144" height="20" rx="10" fill="#FFFFFF"/>

  <!-- Eyes -->
  <g fill="#3E2E26">
    <ellipse cx="108" cy="132" rx="6.5" ry="7.5"/>
    <ellipse cx="148" cy="132" rx="6.5" ry="7.5"/>
  </g>

  <!-- Natural rounded mustache -->
  <path
     fill="#423028"
     d="M 128 158
        C 136 155 147 158 156 164
        C 164 169 170 172 172 168
        C 172 178 162 186 152 186
        C 142 186 134 184 128 184
        C 122 184 114 186 104 186
        C 94 186 84 178 84 168
        C 86 172 92 169 100 164
        C 109 158 120 155 128 158 Z"/>

</svg>
